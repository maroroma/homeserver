spring.datasource.url=jdbc:h2:file:/C/temp/homemusicplayer
spring.h2.console.enabled=true
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

#lenteur smb
jcifs.resolveOrder=DNS
jcifs.smb.client.dfs.disabled=false


musicplayer.localresources.images.supported-extensions=jpg,jpeg,png,gif
musicplayer.localresources.images.thumbs.supported-names=thumb,miniature,folder,albumart,cover
musicplayer.localresources.images.fanart.supported-names=fanart,wallpaper
musicplayer.localresources.images.artist.thumbs=C:/C/musicplayer/thumbs
musicplayer.localresources.images.artist.fanarts=C:/C/musicplayer/fanarts

musicplayer.caches.inpustream.tease=5
musicplayer.caches.inpustream.max-size=10
musicplayer.caches.localcache.directory=C:/C/musicplayer/localcache
musicplayer.caches.localcache.enable=true
musicplayer.caches.localcache.max-size=100

musicplayer.music-source=C:/C/musik
#musicplayer.music-source=smb://192.168.1.51/Volume_1/musik/
musicplayer.music.supported-extensions=mp3,wav,flac
musicplayer.music.album-naming-exception=ost

spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1
spring.servlet.multipart.enabled=false
server.servlet.contextPath=/api


musicplayer.security.smb.username=
musicplayer.security.smb.password=